<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .side-image{
            height: 680px;
            object-fit: cover;
        }
        @media(max-width: 991.98px){
            .side-image{
                height: 150px;
            }
        }
    </style>
</head>
<body class="bg-white">
    <div class="container">
        <div class="row gx-3 p-md-5">
            <div class="col-md-12 col-lg-6 mt-3 col-sm-12 order-2 order-lg-1">
                <div class="bg-white p-5 rounded shadow">
                    <h4 class="fw-bold">Welcome Back</h4>
                    <p class="text-muted small">Today is a new day.it's your day. You shape it. <br>sign in to start managing your projects.</p>
                    <form class="mt-4">
                        <div class="mb-3">
                            <label for="Email">Email</label>
                            <input type="email" class="form-control mt-2" placeholder="Example@gmail.com">
                        </div>
                        <div class="mb-3">
                            <label for="password">password</label>
                            <input type="password" class="form-control mt-2" placeholder="at least 8 characters">
                        </div>
                        <div class="text-end mb-3">
                            <a href="#" class="text-decoration-none small">forget password?</a>
                        </div>
                            <button type="submit" class="btn btn-dark w-100 mb-2 border">Sign in</button>
                            <div class="text-center my-3 text-muted small">or</div>
                            <button type="submit" class="btn btn-outline-dark w-100 mb-2 border"><img src="https://www.google.com/favicon.ico" alt="">sign in with Google</button>
                            <button type="submit" class="btn btn-outline-dark w-100 border"><img src="https://www.facebook.com/favicon.ico" alt="">sign in with facebook</button>
                            <p class="text-center small mt-4">Dont have an account? <a href="#">Sign up</a></p>
                    </form>
                  

                </div>
                </div>
                  <div class="col-md-12 col-lg-6 mt-3 col-sm-12 order-1 order-lg-2">
                        <img src="WhatsApp Image 2026-10-24 at 10.42.36.jpeg" alt="" class="img-fluid w-100 rounded-3 side-image">
                    </div>

                
        
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
      
</body>
</html>
